services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberyan
      POSTGRES_PASSWORD: cyberyan
      POSTGRES_DB: cyberyan
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cyberyan -d cyberyan']
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
      cluster.routing.allocation.disk.threshold_enabled: 'false'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9200/_cluster/health | grep -qE "green|yellow"',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://cyberyan:cyberyan@postgres:5432/cyberyan?schema=public
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: profiles
      LINKEDIN_DATA_PATH: /app/data/linkedin.txt
    ports:
      - '3000:3000'
    volumes:
      - './docs/300 user linkedin.txt:/app/data/linkedin.txt:ro'

volumes:
  postgres_data:
  elasticsearch_data:
